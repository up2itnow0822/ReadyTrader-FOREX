# Smithery configuration: https://smithery.ai/docs/config#smitheryyaml
# ReadyTrader-FOREX: a safety-governed forex trading MCP server (paper FX account, OANDA for live
# orders, a Risk Guardian with a data-driven market guard). https://github.com/up2itnow0822/ReadyTrader-FOREX
# Smithery builds the Dockerfile and starts the MCP server on stdio inside it. Paper mode is the
# default and needs no keys; live trading needs PAPER_MODE=false AND LIVE_TRADING_ENABLED=true.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      PAPER_MODE:
        type: string
        description: "Trade the paper FX account (default). 'false' for live brokerage orders."
        default: "true"
      LIVE_TRADING_ENABLED:
        type: string
        description: "Must be exactly 'true' (with PAPER_MODE=false) for any live order."
        default: "false"
      TRADING_HALTED:
        type: string
        description: "Kill switch: any value other than empty/false/0/no/off refuses every live order."
        default: "false"
      MAX_BROKERAGE_ORDER_AMOUNT:
        type: string
        description: "Largest live order in units of the base currency (unset = no limit)."
      ALLOW_BROKERAGE_SYMBOLS:
        type: string
        description: "Comma-separated pairs live orders may trade, e.g. EURUSD,GBPUSD (unset = all)."
      OANDA_API_KEY:
        type: string
        description: "OANDA API token (live mode only)."
      OANDA_ACCOUNT_ID:
        type: string
        description: "OANDA account id (live mode only)."
      OANDA_ENVIRONMENT:
        type: string
        description: "'practice' (default, OANDA's demo API) or 'live'."
        default: "practice"
      NEWSAPI_KEY:
        type: string
        description: "NewsAPI key for get_financial_news (optional)."
      ALPHAVANTAGE_API_KEY:
        type: string
        description: "Alpha Vantage key for get_market_news (optional)."
    required: []
  commandFunction:
    # Each setting listed above is passed to the server as an environment variable of the same name;
    # nothing else is. EXECUTION_APPROVAL_MODE is not offered: approving a proposal needs the
    # separate approval API and dashboard (app/api_server.py), which a Smithery launch does not run,
    # so every order would become a proposal that can only expire. Orders here run in 'auto' mode.
    |-
    (config) => {
      const allowed = ['PAPER_MODE', 'LIVE_TRADING_ENABLED', 'TRADING_HALTED', 'MAX_BROKERAGE_ORDER_AMOUNT',
        'ALLOW_BROKERAGE_SYMBOLS', 'OANDA_API_KEY', 'OANDA_ACCOUNT_ID', 'OANDA_ENVIRONMENT', 'NEWSAPI_KEY',
        'ALPHAVANTAGE_API_KEY'];
      const env = { EXECUTION_APPROVAL_MODE: 'auto' };
      for (const key of allowed) {
        const value = config ? config[key] : undefined;
        if (value !== undefined && value !== null && value !== '') env[key] = String(value);
      }
      return { command: 'python', args: ['app/main.py'], env };
    }
  exampleConfig:
    PAPER_MODE: "true"