name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (as the README does)
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (includes a real stdio MCP session through python app/main.py)
        run: pytest
      - name: Security scan
        run: bandit -q -c bandit.yaml -r app core common execution intelligence marketdata observability strategy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
